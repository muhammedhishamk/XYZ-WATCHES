<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simple E-Commerce Site</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <div class="container">
      <h1>MyShop</h1>
      <nav>
        <a href="#">Home</a>
        <a href="#">Shop</a>
        <a href="#">Cart</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="products">
      <h2>Products</h2>
      <div class="product-grid">
        <div class="product-card">
          <img src="https://via.placeholder.com/200" alt="Product">
          <h3>Product 1</h3>
          <p>$20.00</p>
        </div>
        <div class="product-card">
          <img src="https://via.placeholder.com/200" alt="Product">
          <h3>Product 2</h3>
          <p>$35.00</p>
        </div>
      </div>
    </section>

    <section class="checkout">
      <h2>Payment Details</h2>
      <form class="payment-form">
        <div class="form-group">
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" placeholder="John Doe" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>

        <div class="form-group">
          <label for="cardnumber">Card Number</label>
          <input type="text" id="cardnumber" placeholder="1111 2222 3333 4444" maxlength="19" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="exp">Expiry Date</label>
            <input type="text" id="exp" placeholder="MM/YY" maxlength="5" required>
          </div>

          <div class="form-group">
            <label for="cvv">CVV</label>
            <input type="text" id="cvv" placeholder="123" maxlength="4" required>
          </div>
        </div>

        <div class="form-group">
          <label for="address">Billing Address</label>
          <input type="text" id="address" placeholder="123 Main Street" required>
        </div>

        <button type="submit">Pay Now</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 MyShop. All rights reserved.</p>
  </footer>



<!-- Keep everything as before -->

<!-- Add this just before -->
<script src="script.js"></script>

</body>
</html>
